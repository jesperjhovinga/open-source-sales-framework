[project]
name = "bdcore"
version = "0.2.0"
description = "Executable spine for the Open Source Sales Framework — context resolution, skill-card validation, prospect sourcing, and seam enforcement."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jesper Hovinga" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["sales", "business-development", "agents", "claude", "spec-driven-development"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/jesperjhovinga/open-source-sales-framework"
Repository = "https://github.com/jesperjhovinga/open-source-sales-framework"
Issues = "https://github.com/jesperjhovinga/open-source-sales-framework/issues"

[project.scripts]
bd = "bdcore.cli:app"

[dependency-groups]
dev = [
  "ruff",
  "ty",
  "pytest",
  "pytest-cov",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line too long — the formatter owns wrapping; it will not split string literals
]

[tool.ruff.lint.isort]
known-first-party = ["bdcore"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
