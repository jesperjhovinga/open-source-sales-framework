name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: extractions/setup-just@v2

      - run: just install

      - name: Lint and type-check
        run: just lint

      - name: Tests
        run: just test

      - name: The seam is law — BD Core stays portable
        run: just seam

      - name: Docs must not lie
        run: just docs
